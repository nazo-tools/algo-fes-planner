<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROUND — algoフェス2026</title>
<style>
/* 見た目は「紙の栞」。見出しだけ明朝、本文は角ゴ、数字は Georgia。
   色相＝会場（朱・藍・紫）、濃さ＝優先度。
   日本語のWebフォントは埋め込めない（数MB／Artifactは外部読み込み不可）ので、
   端末に入っている書体から選んでいる。明朝が無ければ角ゴに落ちる。 */
:root{
  color-scheme:light dark;
  --bg:#faf9f6; --surface:#fff; --sunken:#f0eeea;
  --ink:#1a1a1a; --muted:#56534e; --subtle:#8a867f;
  --line:#ddd9d1; --line-soft:#eae7e1;
  --v-hallHigh:#b0402f; --v-room2f:#1c5a6b; --v-hall2f:#6b4a8a;
  --onblk:#fff; --ghost:.13;
  --star:#a8801c; --warn-bg:#f5efe3; --warn-bd:#e0d3b6; --warn-fg:#7a5410;
  --ok-fg:#2c6a4a;
  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --font-disp:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Times New Roman",serif;
  --font-num:Georgia,"Times New Roman","Hiragino Mincho ProN",serif;
  --shadow:0 1px 2px rgba(26,26,26,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a; --surface:#1e1d22; --sunken:#232227;
  --ink:#ece9e3; --muted:#a29d94; --subtle:#7e786f;
  --line:#34322f; --line-soft:#2a2825;
  --v-hallHigh:#e8735c; --v-room2f:#56b6cc; --v-hall2f:#ab8ad0;
  --onblk:#17161a; --ghost:.22;
  --star:#dcb35a; --warn-bg:#2b2418; --warn-bd:#443a26; --warn-fg:#e0bd79;
  --ok-fg:#7fc4a0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#17161a; --surface:#1e1d22; --sunken:#232227;
  --ink:#ece9e3; --muted:#a29d94; --subtle:#7e786f;
  --line:#34322f; --line-soft:#2a2825;
  --v-hallHigh:#e8735c; --v-room2f:#56b6cc; --v-hall2f:#ab8ad0;
  --onblk:#17161a; --ghost:.22;
  --star:#dcb35a; --warn-bg:#2b2418; --warn-bd:#443a26; --warn-fg:#e0bd79;
  --ok-fg:#7fc4a0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
:where(button,input,select,a):focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.shell{max-width:480px;margin:0 auto;height:min(100dvh,760px);display:flex;flex-direction:column;
  background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.masthead{flex:none;display:flex;align-items:baseline;gap:8px;padding:9px 12px 7px;
  border-bottom:1px solid var(--line)}
.masthead h1{margin:0;font-family:var(--font-num);font-size:1.02rem;font-weight:700;
  letter-spacing:.14em}
.masthead .sub{font-size:.68rem;color:var(--subtle);font-family:var(--font-num)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---- 上ペイン ---- */
.top{flex:0 0 47%;display:flex;flex-direction:column;border-bottom:1px solid var(--line);
  background:var(--bg);min-height:0}
.phases{display:flex;gap:5px;padding:9px 11px 8px}
.phases button{flex:1;padding:7px 5px;border-radius:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font:inherit;font-family:var(--font-disp);font-size:.82rem;font-weight:600;line-height:1.25}
.phases button b{display:block;font-family:var(--font-num);font-size:.6rem;letter-spacing:.12em;
  color:var(--subtle);font-weight:400}
.phases button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.phases button[aria-selected="true"] b{color:var(--surface);opacity:.6}
.topbody{flex:1;overflow-y:auto;padding:0 11px 12px;min-height:0}
.hint{font-size:.73rem;color:var(--subtle);margin:0 0 8px}

.setbar{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.godays{display:flex;gap:5px;align-items:center}
.godays .lbl{font-size:.7rem;color:var(--subtle);font-weight:700;min-width:3.2em}
.godays button{flex:1;padding:5px 6px;border-radius:5px;cursor:pointer;
  border:1px dashed var(--line);background:transparent;color:var(--subtle);
  font:inherit;font-size:.73rem;font-weight:700}
.godays button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);
  background:var(--ink);color:var(--surface)}

/* ---- 使い方 ---- */
.intro{flex:1;overflow-y:auto;padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
.intro h2{margin:0;font-family:var(--font-disp);font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.intro ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.intro li{display:flex;gap:11px;align-items:flex-start}
.intro .no{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-num);font-size:.82rem;
  background:var(--ink);color:var(--surface)}
.intro li b{display:block;font-family:var(--font-disp);font-size:.94rem;font-weight:600}
.intro li p{margin:2px 0 0;font-size:.79rem;color:var(--muted);line-height:1.65}
.intro .fine{margin:0;font-size:.76rem;color:var(--subtle);padding-left:37px;line-height:1.6}
.intro .btn{flex:none;margin-top:auto;align-self:stretch;padding:11px}
/* つくる／みる。作る場所と、でき上がりを見る場所を分ける */
.modes{margin-left:auto;display:flex;gap:3px;flex:none}
.modes button{border:1px solid var(--line);background:var(--surface);color:var(--subtle);
  cursor:pointer;font:inherit;font-family:var(--font-disp);font-size:.73rem;font-weight:600;
  padding:3px 10px;border-radius:4px}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* 一覧を畳んで予定表を広げる */
.fold{flex:none;width:30px;border:1px solid var(--line);background:var(--surface);
  color:var(--subtle);cursor:pointer;font:inherit;font-size:.7rem;border-radius:5px}
.top.folded{flex:none}
.top.folded .topbody{display:none}
.bot.only{background:var(--sunken)}
.vacant{background:var(--surface);border:1px dashed var(--line);border-radius:5px;
  padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:11px;
  align-items:center;margin-top:20px}
.vacant b{font-family:var(--font-disp);font-size:.88rem;color:var(--muted);font-weight:600}
.vacant .btn{width:auto;padding:7px 18px}

.howto{border:0;background:none;color:var(--subtle);font:inherit;font-size:.72rem;
  cursor:pointer;margin-left:auto;padding:2px 0;text-decoration:underline;
  text-underline-offset:3px}

/* ---- 時刻の入力 ---- */
/* ポップの位置はボタンではなく行を基準にする。ボタン基準だと右端ではみ出す。 */
.tf{display:inline-flex;align-items:center;gap:3px}
.tfb{border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  font:inherit;font-family:var(--font-num);font-size:.86rem;padding:4px 11px;border-radius:4px;
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em}
.tfb.empty{font-family:var(--font-ui);font-size:.73rem;color:var(--subtle);border-style:dashed}
.tfb[aria-expanded="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tfx{border:0;background:none;color:var(--subtle);cursor:pointer;font:inherit;font-size:.8rem;
  line-height:1;padding:3px 2px}
.tfp{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px 9px 9px}
.tfl{font-size:.63rem;color:var(--subtle);font-weight:700;margin:0 0 3px}
.tfl:not(:first-child){margin-top:7px}
.tfr{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.tfr.min{grid-template-columns:repeat(6,1fr)}
.tfr button{border:1px solid var(--line-soft);background:var(--bg);color:var(--ink);cursor:pointer;
  font:inherit;font-family:var(--font-num);font-size:.78rem;padding:5px 0;border-radius:3px;
  font-variant-numeric:tabular-nums lining-nums}
.tfr button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.vh{font-family:var(--font-disp);font-size:.68rem;letter-spacing:.14em;color:var(--subtle);
  font-weight:600;margin:11px 0 5px}
.slist{display:flex;flex-direction:column;gap:4px}
.srow{border:1px solid var(--line);border-left:3px solid var(--venue);border-radius:5px;
  background:var(--surface);overflow:hidden}
.srow.done{background:var(--sunken)}
.srow.off{opacity:.5}
.shead{display:flex;align-items:stretch;width:100%}
.fav{flex:none;border:0;background:none;cursor:pointer;padding:8px 2px 8px 8px;
  font-size:.84rem;line-height:1;color:var(--subtle);align-self:center}
.fav[aria-pressed="true"]{color:var(--star)}
.stitle{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:6px 9px 6px 6px;
  cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left}
.th{flex:none;display:block;object-fit:cover;background:var(--sunken)}
.th.sm{width:34px;height:46px;border-radius:3px;border:1px solid var(--line-soft)}
.th.xs{width:18px;height:18px;border-radius:2px;position:absolute;top:2px;left:4px;
  box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.stxt{flex:1;min-width:0}
.nmline{display:flex;align-items:center;gap:5px;min-width:0}
.nm{flex:1;min-width:0;font-family:var(--font-disp);font-size:.85rem;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{flex:none;font-size:.72rem;font-weight:700;color:var(--venue)}
.srow.done .nm{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:7px;font-size:.67rem;color:var(--subtle);
  font-variant-numeric:tabular-nums lining-nums;margin-top:1px}
.meta span:nth-child(-n+3){font-family:var(--font-num)}
.warnq{color:var(--warn-fg);font-weight:700;font-family:var(--font-ui)!important}
.okq{color:var(--ok-fg);font-weight:700;font-family:var(--font-ui)!important}

.rescue{border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn-fg);
  border-radius:5px;padding:9px 10px;margin-bottom:9px;font-size:.74rem}
.rescue b{display:block;margin-bottom:4px;font-family:var(--font-disp);font-size:.78rem}
.rescue button{display:block;width:100%;text-align:left;margin-top:5px;border-radius:4px;
  border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;
  font:inherit;font-size:.72rem;padding:5px 8px;line-height:1.35}

.winrow{display:flex;gap:6px;align-items:center;font-size:.7rem;color:var(--muted);
  margin-bottom:6px;position:relative}
.winrow .lbl{font-weight:700;min-width:4.8em;flex:none}
.winrow .tilde{color:var(--subtle);flex:none}
.favonly{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin:6px 0 2px}

.slots{padding:0 9px 9px;border-top:1px solid var(--line-soft)}
.dl{font-size:.68rem;color:var(--subtle);margin:7px 0 4px;font-weight:700}
.sc{display:flex;flex-wrap:wrap;gap:4px}
.sc button{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:4px;padding:3px 8px;cursor:pointer;font:inherit;font-size:.74rem;
  font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
.sc button:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}

.restbar{display:flex;gap:6px;margin:9px 0 4px}
.btn{flex:1;padding:9px 6px;border-radius:5px;cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:var(--surface);font:inherit;font-family:var(--font-disp);
  font-size:.83rem;font-weight:600}
.btn.sub{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.brk{margin-top:10px;padding:9px 10px 10px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface);display:flex;flex-direction:column;gap:7px}
.brkh{display:flex;align-items:center;gap:7px;width:100%;padding:0;border:0;background:none;
  cursor:pointer;text-align:left;font:inherit;font-family:var(--font-disp);font-size:.78rem;
  font-weight:600;color:var(--muted)}
.brkh .sign{flex:none;width:17px;height:17px;display:inline-flex;align-items:center;
  justify-content:center;line-height:1;border:1px solid var(--line);border-radius:3px;
  font-family:var(--font-num);font-size:.8rem;color:var(--subtle)}
.brk.open .brkh .sign{border-color:var(--ink);color:var(--ink)}
.brkrow{display:flex;gap:7px;align-items:center;position:relative}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;padding:5px 4px;border-radius:4px;cursor:pointer;font:inherit;font-size:.73rem;
  font-weight:700;border:1px dashed var(--line);background:transparent;color:var(--subtle)}
.brkrow .seg button{font-size:.72rem}
.brkrow.times .tf{flex:1}
.brkrow.times .tfb{width:100%;text-align:center}
.tfsep{color:var(--subtle);font-size:.78rem}
.seg.lab button{font-weight:400;font-size:.72rem}
.seg button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);
  background:var(--ink);color:var(--surface)}
.brk .btn{padding:8px 6px;font-size:.79rem;font-variant-numeric:tabular-nums lining-nums}

.slink{display:block;margin-top:9px;font-size:.72rem;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px}

.gapc{border:1px dashed var(--line);border-radius:5px;padding:8px 9px;margin-bottom:6px;
  background:var(--surface)}
.gapc .gt{font-family:var(--font-disp);font-size:.76rem;font-weight:600;
  font-variant-numeric:tabular-nums lining-nums}
.gapc .gs{font-family:var(--font-num);font-size:.68rem;color:var(--subtle);
  font-variant-numeric:tabular-nums lining-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px dashed var(--venue);background:transparent;color:var(--ink);border-radius:4px;
  padding:3px 9px;cursor:pointer;font:inherit;font-size:.72rem;
  font-variant-numeric:tabular-nums lining-nums}
.chip::before{content:"＋";color:var(--venue);font-weight:700;margin-right:3px}
.chip .lc{color:var(--warn-fg);font-weight:700}
.none{font-size:.72rem;color:var(--subtle)}

/* ---- 下ペイン ---- */
.bot{flex:1;overflow-y:auto;background:var(--sunken);padding:9px 11px 14px;min-height:0}

/* 当日の「次はこれ」。会場で一番先に目に入る場所なので、ここだけ紙を白く抜く */
.now{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:8px 10px 9px;margin-bottom:9px}
.nrow{border-left:3px solid var(--venue,var(--line));padding-left:8px}
.nrow + .nrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)}
.nh{display:flex;align-items:baseline;gap:6px}
.nk{font-family:var(--font-disp);font-size:.7rem;font-weight:600;color:var(--surface);
  background:var(--ink);border-radius:3px;padding:1px 6px;flex:none}
.nrow.nxt .nk{background:none;color:var(--muted);border:1px solid var(--line);padding:0 5px}
.nt{font-family:var(--font-disp);font-size:.86rem;font-weight:600;color:var(--ink);line-height:1.3}
.nx{margin-left:auto;flex:none;padding-left:8px;font-family:var(--font-num);font-size:.74rem;
  color:var(--ink)}
.nrow.cur .nx{color:var(--v-hallHigh);font-weight:700}
.nsub{display:flex;align-items:baseline;margin-top:2px;font-size:.68rem;color:var(--subtle);
  font-variant-numeric:tabular-nums lining-nums}
.nfoot{margin-top:7px;font-size:.68rem;color:var(--subtle)}
.nend{font-family:var(--font-disp);font-size:.8rem;color:var(--muted)}
.now.pre{background:none;border-style:dashed}
.npre{font-size:.68rem;color:var(--subtle);margin-bottom:6px}
.tot{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:.73rem;
  font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;
  margin-bottom:8px;color:var(--muted)}
.tot b{font-family:var(--font-disp);font-size:.9rem;color:var(--ink);font-weight:600}
.tot .sp{margin-left:auto;color:var(--subtle)}
.clrbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-2px 0 9px}
.clrbar .q{font-size:.71rem;color:var(--muted);flex:1;min-width:11em}
.clr{border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;
  font:inherit;font-size:.71rem;padding:4px 10px;border-radius:4px}
.clr.armed{border-color:var(--v-hallHigh);color:var(--v-hallHigh);font-weight:700}
.board{display:grid;grid-template-columns:32px 1fr 1fr;gap:5px;position:relative}
.seg.vday{margin-bottom:9px}
.seg.vday button{font-size:.72rem}
.dh{font-family:var(--font-disp);font-size:.7rem;font-weight:600;color:var(--muted);
  text-align:center;padding-bottom:3px;position:sticky;top:0;background:var(--sunken);z-index:2}
.dh.ax{color:transparent}
.axc{position:relative}
.axc .tk{position:absolute;right:2px;font-family:var(--font-num);font-size:.62rem;
  color:var(--subtle);transform:translateY(-.5em);font-variant-numeric:tabular-nums lining-nums}
.daycol{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:5px}
.daycol .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line-soft)}
.ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 5px;overflow:hidden;
  background:var(--venue);color:var(--onblk)}
.ev .et{font-family:var(--font-disp);font-size:.66rem;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .ee{font-family:var(--font-num);font-size:.59rem;opacity:.85;
  font-variant-numeric:tabular-nums lining-nums}
.ev .x{position:absolute;top:0;right:1px;border:0;background:none;cursor:pointer;
  color:var(--onblk);opacity:.8;font-size:.72rem;line-height:1;padding:2px 3px}
.ev.rest{background:repeating-linear-gradient(135deg,var(--sunken) 0 5px,transparent 5px 10px);
  border:1px dashed var(--line);color:var(--muted)}
.ev.rest .x{color:var(--muted)}
.ev.new{outline:2px solid var(--ink);outline-offset:-2px}
.ev.past{opacity:.4}

/* 共有 */
.shbar{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:5px;
  padding:8px 10px 9px;margin-bottom:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shbar b{font-family:var(--font-disp);font-size:.8rem;color:var(--warn-fg);width:100%}
.shbar .q{font-size:.68rem;color:var(--muted);width:100%;line-height:1.5}
.share{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:8px 10px 9px;margin-bottom:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.surl{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--bg);
  color:var(--muted);font:inherit;font-family:var(--font-num);font-size:.7rem;padding:5px 7px}
.share .fine{width:100%;margin:2px 0 0;font-size:.66rem;color:var(--subtle);line-height:1.55}
.emptyday{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:var(--subtle)}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.notice{max-width:480px;margin:0 auto;padding:12px 14px 22px;border-top:1px solid var(--line);
  font-size:.71rem;line-height:1.6;color:var(--subtle);background:var(--bg)}
.notice p{margin:0 0 5px}
.notice b{color:var(--muted)}
.notice a{color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1>ROUND</h1>
    <span class="sub">algoフェス2026</span>
    <div class="modes">
      <button id="m-make" aria-pressed="true">つくる</button>
      <button id="m-view" aria-pressed="false">みる</button>
    </div>
    <button class="howto" id="howto">使い方</button>
  </header>
  <main id="app"></main>
</div>
<script>
(function () {
"use strict";

/* ===== shows.js ===== */

/* ===== planner.js ===== */
// はしごプランの探索ロジック。DOM には一切触れない純粋関数だけを置く。

const RANK_KEYS = ["must", "want", "maybe"];

/** ビットマスクDPの上限。2^18 = 262144 マスクまで。フェスの公演数(12)には十分な余裕がある。 */
const MAX_SELECTABLE_SHOWS = 18;

/** "HH:MM" を 0時からの分に変換する。 */
function toMinutes(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm ?? "").trim());
  if (!m) throw new Error(`時刻の形式が不正です: ${hhmm}`);
  const h = Number(m[1]);
  const mi = Number(m[2]);
  if (h > 23 || mi > 59) throw new Error(`時刻の範囲が不正です: ${hhmm}`);
  return h * 60 + mi;
}

/** 分を "H:MM" 表記に戻す（テキスト出力用）。 */
function toHHMM(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${h}:${String(m).padStart(2, "0")}`;
}

/**
 * prev の直後に next を入れられるか。
 * あきが 0 分ちょうど（前の終了と次の開始が同時刻）は、バッファ0でも繋がらない扱いにする。
 */
function canFollow(prev, next, bufferMin = 0) {
  const gap = toMinutes(next.start) - toMinutes(prev.end);
  return gap > 0 && gap >= bufferMin;
}

/** あき(分)がバッファ条件を満たすか。 */
function gapOk(gap, bufferMin) {
  return gap > 0 && gap >= bufferMin;
}

/** 対象公演の、条件に合う枠だけを集める。 */
function collectSlots(show, { day, minStartMin, maxEndMin }) {
  const out = [];
  for (const slot of show.slots ?? []) {
    if (day && slot.day !== day) continue;
    const startMin = toMinutes(slot.start);
    const endMin = toMinutes(slot.end);
    if (startMin < minStartMin || endMin > maxEndMin) continue;
    out.push({
      showId: show.id,
      title: show.title,
      venue: show.venue,
      day: slot.day,
      start: slot.start,
      end: slot.end,
      startMin,
      endMin,
    });
  }
  out.sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);
  return out;
}

function normalizeOpts(opts = {}) {
  return {
    day: opts.day ?? null,
    bufferMin: opts.bufferMin ?? 10,
    minStartMin: opts.earliestStart == null ? -Infinity : toMinutes(opts.earliestStart),
    maxEndMin: opts.latestEnd == null ? Infinity : toMinutes(opts.latestEnd),
    maxPlans: opts.maxPlans ?? 20,
  };
}

/**
 * 成立するプランを探して、良い順に返す。
 *
 * 「どの公演を観るか」の集合ごとにビットマスクDPで最小終了時刻を求める。
 * 同じ公演の組み合わせは1プランにまとめるので、結果が似たものだらけにならない。
 *
 * @param shows 公演の配列（shows.js の SHOWS 形式）
 * @param ranks { showId: "must" | "want" | "maybe" }
 * @returns { plans, tooManyShows, feasibleCount }
 */
function findPlans(shows, ranks, opts = {}) {
  const o = normalizeOpts(opts);
  const selected = (shows ?? []).filter((s) => RANK_KEYS.includes(ranks?.[s.id]));

  if (selected.length === 0) {
    return { plans: [], tooManyShows: false, feasibleCount: 0 };
  }
  if (selected.length > MAX_SELECTABLE_SHOWS) {
    return { plans: [], tooManyShows: true, feasibleCount: 0 };
  }

  const slotsByShow = selected.map((s) => collectSlots(s, o));
  const n = selected.length;
  const { best, from, size } = buildDP(slotsByShow, o.bufferMin);

  // 極大な集合（これ以上どの公演も足せない）だけをプランにする。
  const plans = [];
  let feasibleCount = 0;
  for (let mask = 1; mask < size; mask++) {
    if (best[mask] === Infinity) continue;
    feasibleCount++;

    let maximal = true;
    for (let k = 0; k < n && maximal; k++) {
      const bit = 1 << k;
      if (mask & bit) continue;
      if (best[mask | bit] < Infinity) maximal = false;
    }
    if (!maximal) continue;

    const order = reconstructOrder(mask, from);
    const slots = compact(order, slotsByShow, from, mask, best, o.bufferMin);
    plans.push(buildPlan(order, slots, selected, ranks));
  }

  plans.sort(comparePlans);
  return { plans: plans.slice(0, o.maxPlans), tooManyShows: false, feasibleCount };
}

/**
 * 公演ごとの候補枠から、部分集合ごとの「ありうる最も早い終了時刻」を求める。
 *
 * best[mask] が Infinity なら、その組み合わせは1日に収まらない。
 * 最も早く終わる組み方を持てば、そのあとに足せるものは必ず足せるので、この値だけで足りる。
 */
function buildDP(slotsByShow, bufferMin) {
  const n = slotsByShow.length;
  const size = 1 << n;
  const best = new Float64Array(size).fill(Infinity);
  const from = new Array(size).fill(null);
  best[0] = -Infinity;

  for (let mask = 0; mask < size; mask++) {
    const cur = best[mask];
    if (cur === Infinity) continue;
    for (let k = 0; k < n; k++) {
      const bit = 1 << k;
      if (mask & bit) continue;

      let pick = null;
      for (const slot of slotsByShow[k]) {
        if (!gapOk(slot.startMin - cur, bufferMin)) continue;
        if (pick === null || slot.endMin < pick.endMin) pick = slot;
      }
      if (pick === null) continue;

      const next = mask | bit;
      if (pick.endMin < best[next]) {
        best[next] = pick.endMin;
        from[next] = { prevMask: mask, showIndex: k };
      }
    }
  }
  return { best, from, size, n };
}

/** from を辿って、mask の公演を観る順（時系列）の showIndex 配列を返す。 */
function reconstructOrder(mask, from) {
  const order = [];
  let cur = mask;
  while (cur !== 0) {
    const step = from[cur];
    order.push(step.showIndex);
    cur = step.prevMask;
  }
  order.reverse();
  return order;
}

/**
 * DP は「最も早く終わる」枠を選ぶので、途中に無駄なあきが残ることがある。
 * 最後の公演は DP の選択を保ったまま、手前の公演を後ろへ寄せて待ち時間を詰める。
 */
function compact(order, slotsByShow, from, mask, best, bufferMin) {
  const dpSlots = dpSlotsOf(order, slotsByShow, best, from, mask, bufferMin);
  if (order.length <= 1) return dpSlots;

  const result = new Array(order.length);
  result[order.length - 1] = dpSlots[order.length - 1];
  let limit = result[order.length - 1].startMin;

  for (let i = order.length - 2; i >= 0; i--) {
    let pick = null;
    for (const slot of slotsByShow[order[i]]) {
      if (!gapOk(limit - slot.endMin, bufferMin)) continue;
      if (pick === null || slot.startMin > pick.startMin) pick = slot;
    }
    if (pick === null) return dpSlots; // 詰められないときは DP の結果をそのまま使う
    result[i] = pick;
    limit = pick.startMin;
  }
  return result;
}

/** DP が実際に選んだ枠を、前から順に引き直す。 */
function dpSlotsOf(order, slotsByShow, best, from, mask, bufferMin) {
  // from はマスク単位でしか持っていないので、前から貪欲に引き直す（DP と同じ選び方）。
  const slots = [];
  let cur = -Infinity;
  for (const k of order) {
    let pick = null;
    for (const slot of slotsByShow[k]) {
      if (!gapOk(slot.startMin - cur, bufferMin)) continue;
      if (pick === null || slot.endMin < pick.endMin) pick = slot;
    }
    slots.push(pick);
    cur = pick.endMin;
  }
  return slots;
}

function buildPlan(order, slots, selected, ranks) {
  const items = order.map((k, i) => {
    const slot = slots[i];
    const next = slots[i + 1];
    return {
      showId: selected[k].id,
      title: selected[k].title,
      venue: selected[k].venue,
      price: selected[k].price ?? 0,
      unit: selected[k].unit ?? "person",
      rank: ranks[selected[k].id],
      day: slot.day,
      start: slot.start,
      end: slot.end,
      startMin: slot.startMin,
      endMin: slot.endMin,
      gapAfterMin: next ? next.startMin - slot.endMin : null,
    };
  });

  const score = {
    must: 0, want: 0, maybe: 0, count: items.length,
    idleMin: 0, spanMin: 0,
    // 1人あたりの料金と、1組あたりの料金は足し合わせられないので分けて持つ
    pricePerPerson: 0, priceGroup: 0,
  };
  for (const it of items) {
    score[it.rank]++;
    if (it.unit === "group") score.priceGroup += it.price;
    else score.pricePerPerson += it.price;
  }
  for (let i = 1; i < items.length; i++) score.idleMin += items[i].startMin - items[i - 1].endMin;
  if (items.length) score.spanMin = items[items.length - 1].endMin - items[0].startMin;

  return {
    key: items.map((i) => i.showId).sort().join("+"),
    items,
    score,
  };
}

function comparePlans(a, b) {
  return (
    b.score.must - a.score.must ||
    b.score.want - a.score.want ||
    b.score.maybe - a.score.maybe ||
    a.score.idleMin - b.score.idleMin ||
    a.score.spanMin - b.score.spanMin ||
    a.items[0].startMin - b.items[0].startMin
  );
}

/* ------------------------------------------------------------------
   ここから下は「自分で置いた予定を前提に、残りを埋める」ための関数。
   fixed には置いた公演も休憩も同じ形で入れる:
     { day, start, end, showId?, label? }
   showId があるものはその公演を配置済みとみなす。無いものは単に時間を塞ぐ。
   ------------------------------------------------------------------ */

/** その枠が、固定された予定のどれかとぶつかるか。 */
function hitsFixed(slot, fixedOnDay, bufferMin) {
  return fixedOnDay.some((f) => {
    const fa = toMinutes(f.start);
    const fb = toMinutes(f.end);
    const after = gapOk(slot.startMin - fb, bufferMin);
    const before = gapOk(fa - slot.endMin, bufferMin);
    return !after && !before;
  });
}

/**
 * まだ置いていない公演について、いま置ける枠を日をまたいで列挙する。
 *
 * options が1件だけなら「ここを逃すともう入らない」ということ。UIで警告に使う。
 */
function placementOptions(shows, fixed = [], opts = {}) {
  const { days = [], bufferMin = 10 } = opts;
  const placed = new Set(fixed.filter((f) => f.showId).map((f) => f.showId));

  return (shows ?? [])
    .filter((s) => !placed.has(s.id))
    .map((show) => {
      const options = [];
      for (const day of days) {
        const fixedOnDay = fixed.filter((f) => f.day === day);
        for (const slot of collectSlots(show, { day, minStartMin: -Infinity, maxEndMin: Infinity })) {
          if (!hitsFixed(slot, fixedOnDay, bufferMin)) options.push(slot);
        }
      }
      return { showId: show.id, title: show.title, venue: show.venue, options };
    });
}

/** その日の予定を並べたときの、あいだの空き時間の合計。 */
function totalIdle(entries) {
  const s = [...entries].sort((a, b) => a.startMin - b.startMin);
  let idle = 0;
  for (let i = 1; i < s.length; i++) idle += s[i].startMin - s[i - 1].endMin;
  return idle;
}

/** その枠が、並んでいる予定のどれともぶつからないか。 */
function freeAgainst(slot, entries, bufferMin) {
  return entries.every(
    (e) => gapOk(slot.startMin - e.endMin, bufferMin) || gapOk(e.startMin - slot.endMin, bufferMin),
  );
}

/**
 * 入れる公演はそのままに、それぞれを別の回へ振り替えて待ち時間を減らす。
 *
 * 何を入れるかは部分集合DPで決めたあとなので、ここでは「どの回にするか」だけを動かす。
 * 1つずつ最良の回へ移すのを、改善が止まるまで繰り返す。
 */
function minimizeIdle(fixedOnDay, added, slotsByShowId, bufferMin) {
  const cur = added.map((a) => ({ ...a }));
  for (let pass = 0; pass < 4; pass++) {
    let improved = false;
    for (let i = 0; i < cur.length; i++) {
      const others = [...fixedOnDay, ...cur.filter((_, j) => j !== i)];
      let bestIdle = totalIdle([...others, cur[i]]);
      let bestSlot = null;
      for (const slot of slotsByShowId.get(cur[i].showId) ?? []) {
        if (slot.startMin === cur[i].startMin) continue;
        if (!freeAgainst(slot, others, bufferMin)) continue;
        const idle = totalIdle([...others, slot]);
        if (idle < bestIdle) {
          bestIdle = idle;
          bestSlot = slot;
        }
      }
      if (bestSlot) {
        cur[i] = {
          ...cur[i],
          start: bestSlot.start,
          end: bestSlot.end,
          startMin: bestSlot.startMin,
          endMin: bestSlot.endMin,
        };
        improved = true;
      }
    }
    if (!improved) break;
  }
  return cur;
}

/**
 * 自分で置いた予定を動かさずに、残りの公演を詰める。
 *
 * 日ごとに部分集合DPを作ってから、どの公演をどちらの日に回すかを部分集合の
 * 組み合わせで決める。土曜のこの枠を逃すと日曜にも入らない、が正しく効くようにするため、
 * 片方ずつ貪欲に埋めるのではなく両日を同時に見る。
 *
 * 優先順位は「お気に入りの数 → 全体の数」。何を入れるかが決まったあと、
 * 待ち時間が短くなる回へ振り替える。
 *
 * @param opts.favoriteIds 先に入れたい公演
 * @param opts.onlyFavorites お気に入り以外を候補にしない
 * @param opts.windows { [day]: { from, to } } その日に入れてよい時間帯
 */
function suggestFills(shows, fixed = [], opts = {}) {
  const { days = [], bufferMin = 10, favoriteIds = [], onlyFavorites = false, windows = {} } = opts;
  const placed = new Set(fixed.filter((f) => f.showId).map((f) => f.showId));
  const favs = new Set(favoriteIds);
  let targets = (shows ?? []).filter((s) => !placed.has(s.id));
  if (onlyFavorites) targets = targets.filter((s) => favs.has(s.id));

  const none = { added: [], tooManyShows: false, idleByDay: {} };
  if (targets.length === 0 || days.length === 0) return none;
  if (targets.length > MAX_SELECTABLE_SHOWS) return { added: [], tooManyShows: true, idleByDay: {} };

  // 日ごとに、固定された予定とぶつからない枠だけを候補にしてDPを作る。
  // 個別にぶつからない枠どうしが繋がっていれば、固定ぶんと合わせても必ず成立する。
  const dps = days.map((day) => {
    const fixedOnDay = fixed.filter((f) => f.day === day);
    const w = windows[day] ?? {};
    const bounds = {
      day,
      minStartMin: w.from == null || w.from === "" ? -Infinity : toMinutes(w.from),
      maxEndMin: w.to == null || w.to === "" ? Infinity : toMinutes(w.to),
    };
    const slotsByShow = targets.map((s) =>
      collectSlots(s, bounds).filter((slot) => !hitsFixed(slot, fixedOnDay, bufferMin)),
    );
    return { day, slotsByShow, ...buildDP(slotsByShow, bufferMin) };
  });

  // どの公演をどの日に回すか。reach[mask] = その集合を今までの日で全部さばけるか。
  const size = 1 << targets.length;
  let reach = new Uint8Array(size);
  reach[0] = 1;
  const picks = [];

  for (const dp of dps) {
    const next = new Uint8Array(size);
    const pick = new Int32Array(size).fill(-1);
    for (let mask = 0; mask < size; mask++) {
      for (let sub = mask; ; sub = (sub - 1) & mask) {
        if (reach[mask ^ sub] && dp.best[sub] < Infinity) {
          next[mask] = 1;
          pick[mask] = sub;
          break;
        }
        if (sub === 0) break;
      }
    }
    reach = next;
    picks.push(pick);
  }

  // お気に入りの数を先に、次に全体の数を最大にする
  let favMask = 0;
  targets.forEach((s, k) => {
    if (favs.has(s.id)) favMask |= 1 << k;
  });

  let bestMask = 0;
  let bestScore = 0;
  for (let mask = 1; mask < size; mask++) {
    if (!reach[mask]) continue;
    const score = popcount(mask & favMask) * 1000 + popcount(mask);
    if (score > bestScore) {
      bestScore = score;
      bestMask = mask;
    }
  }
  if (bestMask === 0) return none;

  // 日ごとの担当を後ろから割り戻す
  const perDay = new Array(dps.length).fill(0);
  let rest = bestMask;
  for (let i = dps.length - 1; i >= 0; i--) {
    perDay[i] = picks[i][rest];
    rest ^= perDay[i];
  }

  const added = [];
  const idleByDay = {};
  dps.forEach((dp, i) => {
    const mask = perDay[i];
    const fixedOnDay = fixed
      .filter((f) => f.day === dp.day)
      .map((f) => ({ startMin: toMinutes(f.start), endMin: toMinutes(f.end) }));

    if (!mask) {
      idleByDay[dp.day] = totalIdle(fixedOnDay);
      return;
    }

    const order = reconstructOrder(mask, dp.from);
    const slots = compact(order, dp.slotsByShow, dp.from, mask, dp.best, bufferMin);
    let dayAdds = order.map((k, j) => {
      const show = targets[k];
      const slot = slots[j];
      return {
        showId: show.id,
        title: show.title,
        venue: show.venue,
        price: show.price ?? 0,
        unit: show.unit ?? "person",
        day: dp.day,
        start: slot.start,
        end: slot.end,
        startMin: slot.startMin,
        endMin: slot.endMin,
      };
    });

    // 入れるものは変えずに、待ち時間が短くなる回へ振り替える
    const slotsByShowId = new Map(order.map((k) => [targets[k].id, dp.slotsByShow[k]]));
    dayAdds = minimizeIdle(fixedOnDay, dayAdds, slotsByShowId, bufferMin);

    idleByDay[dp.day] = totalIdle([...fixedOnDay, ...dayAdds]);
    added.push(...dayAdds);
  });

  added.sort((a, b) => (a.day < b.day ? -1 : a.day > b.day ? 1 : a.startMin - b.startMin));
  return { added, tooManyShows: false, idleByDay };
}

/**
 * お気に入りが入らなくなったとき、置いてある公演を別の回へ移せば助かるかを探す。
 *
 * 休憩は動かさない（自分で置いた予定なので）。移す先は元の予定とぶつからない回だけ。
 *
 * @returns [{ showId, title, swaps: [{ showId, title, from, to, thenAt }] }]
 */
function rescueSuggestions(shows, fixed = [], favoriteIds = [], opts = {}) {
  const { days = [], bufferMin = 10, maxSwaps = 3 } = opts;
  const byId = new Map((shows ?? []).map((s) => [s.id, s]));
  const placed = new Set(fixed.filter((f) => f.showId).map((f) => f.showId));

  const optMap = new Map(
    placementOptions(shows, fixed, { days, bufferMin }).map((o) => [o.showId, o.options]),
  );
  const blocked = favoriteIds.filter(
    (id) => byId.has(id) && !placed.has(id) && (optMap.get(id)?.length ?? 0) === 0,
  );
  if (blocked.length === 0) return [];

  /** その予定の並びで、show がどこかに入れるか。 */
  const canStillFit = (show, trial) => {
    for (const day of days) {
      const onDay = trial.filter((f) => f.day === day);
      for (const slot of collectSlots(show, { day, minStartMin: -Infinity, maxEndMin: Infinity })) {
        if (!hitsFixed(slot, onDay, bufferMin)) return slot;
      }
    }
    return null;
  };

  const movable = fixed.filter((f) => f.showId && byId.has(f.showId));

  return blocked.map((id) => {
    const target = byId.get(id);
    const swaps = [];
    for (const f of movable) {
      if (swaps.length >= maxSwaps) break;
      const moving = byId.get(f.showId);
      const others = fixed.filter((g) => g !== f);
      for (const alt of moving.slots) {
        if (!days.includes(alt.day)) continue; // 参加しない日へは移さない
        if (alt.day === f.day && alt.start === f.start) continue;
        const altSlot = { startMin: toMinutes(alt.start), endMin: toMinutes(alt.end) };
        if (hitsFixed(altSlot, others.filter((g) => g.day === alt.day), bufferMin)) continue;

        const trial = [...others, { ...f, day: alt.day, start: alt.start, end: alt.end }];
        const spot = canStillFit(target, trial);
        if (!spot) continue;

        swaps.push({
          showId: f.showId,
          title: moving.title,
          from: { day: f.day, start: f.start, end: f.end },
          to: { day: alt.day, start: alt.start, end: alt.end },
          thenAt: { day: spot.day, start: spot.start, end: spot.end },
        });
        break; // 同じ公演で複数の移し先は出さない
      }
    }
    return { showId: id, title: target.title, swaps };
  });
}

function popcount(x) {
  let c = 0;
  while (x) {
    x &= x - 1;
    c++;
  }
  return c;
}

/**
 * あきに入れられる公演の組み合わせを、入る数の多い順に返す。
 *
 * 判定は findPlans をそのまま使う。衝突の考え方が2本に分かれると必ずズレるため。
 * afterMin は直前の公演の終了、beforeMin は直後の公演の開始（どちらも分、null で制限なし）。
 *
 * @returns findPlans と同じ形。plans[0] が一番多く入る組み合わせ。
 */
function fillGap(shows, opts = {}) {
  const {
    day = null,
    bufferMin = 10,
    afterMin = null,
    beforeMin = null,
    excludeIds = [],
    maxPlans = 5,
  } = opts;

  const margin = Math.max(bufferMin, 1); // 0分乗り換えは認めない
  const empty = { plans: [], tooManyShows: false, feasibleCount: 0 };

  const lo = afterMin == null ? null : afterMin + margin;
  const hi = beforeMin == null ? null : beforeMin - margin;
  if (lo != null && (lo < 0 || lo > 1439)) return empty;
  if (hi != null && (hi < 0 || hi > 1439)) return empty;
  if (lo != null && hi != null && lo >= hi) return empty;

  const exclude = new Set(excludeIds);
  const targets = (shows ?? []).filter((s) => !exclude.has(s.id));
  if (targets.length === 0) return empty;

  const ranks = Object.fromEntries(targets.map((s) => [s.id, "want"]));
  return findPlans(targets, ranks, {
    day,
    bufferMin,
    maxPlans,
    earliestStart: lo == null ? null : toHHMM(lo),
    latestEnd: hi == null ? null : toHHMM(hi),
  });
}

/**
 * 必須が全部入らないときに、原因を名指しするための診断。
 * @returns { pairs, noSlot } pairs はどの枠を選んでも両立しない必須ペア
 */
function diagnoseConflicts(shows, mustIds, opts = {}) {
  const o = normalizeOpts(opts);
  const byId = new Map((shows ?? []).map((s) => [s.id, s]));

  const noSlot = [];
  const usable = [];
  for (const id of mustIds ?? []) {
    const show = byId.get(id);
    if (!show) continue;
    const slots = collectSlots(show, o);
    if (slots.length === 0) noSlot.push({ id: show.id, title: show.title });
    else usable.push({ show, slots });
  }

  const pairs = [];
  for (let i = 0; i < usable.length; i++) {
    for (let j = i + 1; j < usable.length; j++) {
      const A = usable[i];
      const B = usable[j];
      const compatible = A.slots.some((a) =>
        B.slots.some(
          (b) =>
            gapOk(b.startMin - a.endMin, o.bufferMin) ||
            gapOk(a.startMin - b.endMin, o.bufferMin),
        ),
      );
      if (!compatible) {
        pairs.push({
          a: A.show.id,
          b: B.show.id,
          aTitle: A.show.title,
          bTitle: B.show.title,
        });
      }
    }
  }

  return { pairs, noSlot };
}

/** プランを共有用のプレーンテキストにする。 */
function formatPlanAsText(plan, { dayLabel = "", venueLabels = {}, title = "はしごプラン" } = {}) {
  const header = dayLabel ? `${title}｜${dayLabel}` : title;
  const lines = [header, ""];

  plan.items.forEach((it, i) => {
    const venue = venueLabels[it.venue] ?? it.venue;
    lines.push(`${it.start}-${it.end}  ${it.title}（${venue}）`);
    if (i < plan.items.length - 1) {
      lines.push(`　　↓ ${it.gapAfterMin}分あき`);
    }
  });

  const money = [];
  if (plan.score.pricePerPerson) money.push(`¥${plan.score.pricePerPerson.toLocaleString("ja-JP")}/人`);
  if (plan.score.priceGroup) money.push(`¥${plan.score.priceGroup.toLocaleString("ja-JP")}/回`);
  if (money.length) lines.push("", `公演の合計 ${money.join(" ＋ ")}（入場チケットは別）`);

  return lines.join("\n");
}

/* ---------------- 当日 ---------------- */

/**
 * 今が会期中かどうかを、端末の時計から見る。
 * 会期中なら { day, min }、そうでなければ null。
 * 日付は端末のローカル時刻で見る（現地で開くので、それでいい）。
 */
function festivalNow(date, fes) {
  if (date.getFullYear() !== fes.year) return null;
  const id =
    String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
  if (!fes.days.some((d) => d.id === id)) return null;
  return { day: id, min: date.getHours() * 60 + date.getMinutes() };
}

/**
 * 立てた予定を「今」で切って、いま出ているもの・次のもの・終わったものに分ける。
 * 当日は全体を見渡したいわけではなく、次に何をすればいいかだけが知りたい。
 *
 * untilNext は次が始まるまでの分。leftOfCurrent は今出ているものが終わるまでの分。
 */
function nowNext(fixed, now) {
  const today = fixed
    .filter((f) => f.day === now.day)
    .map((f) => ({ ...f, a: toMinutes(f.start), b: toMinutes(f.end) }))
    .sort((x, y) => x.a - y.a);

  const t = now.min;
  const current = today.find((f) => f.a <= t && t < f.b) ?? null;
  const upcoming = today.filter((f) => f.a > t);
  const next = upcoming[0] ?? null;

  return {
    current,
    next,
    later: upcoming.slice(1),
    done: today.filter((f) => f.b <= t),
    untilNext: next ? next.a - t : null,
    leftOfCurrent: current ? current.b - t : null,
  };
}

/* ===== storage.js ===== */
// 立てた予定の保存と読み戻し。
//
// 当日、電車の中で開き直したら予定が消えていた、が一番困る。
// ただし保存したデータのほうが古くなることはある（公演データを直したあとなど）ので、
// 読み戻すときは今のデータと突き合わせて、実在しないものは黙って捨てる。



const STORAGE_KEY = "algo-fes-planner/v1";

const isHHMM = (v) => typeof v === "string" && /^\d{1,2}:\d{2}$/.test(v);

/** 保存する形に落とす。Set は配列にする。 */
function encodeState(s) {
  return {
    v: 1,
    fixed: s.fixed,
    favorites: [...s.favorites],
    going: [...s.going],
    windows: s.windows,
    onlyFav: s.onlyFav,
    introDone: !s.intro,
  };
}

/**
 * 読み戻す。壊れていたり古かったりする前提で、通ったものだけを返す。
 * 何も残らなければ null（=初期状態で始める）。
 */
function decodeState(raw, { shows, days }) {
  if (!raw || typeof raw !== "object" || raw.v !== 1) return null;

  const byId = new Map(shows.map((s) => [s.id, s]));
  const dayset = new Set(days);

  const going = Array.isArray(raw.going) ? raw.going.filter((d) => dayset.has(d)) : [];
  const goingSet = new Set(going.length ? going : days);

  const fixed = [];
  const seen = new Set();
  for (const f of Array.isArray(raw.fixed) ? raw.fixed : []) {
    if (!f || !goingSet.has(f.day) || !isHHMM(f.start) || !isHHMM(f.end)) continue;

    if (f.showId != null) {
      const show = byId.get(f.showId);
      if (!show) continue; // 消えた公演
      if (seen.has(f.showId)) continue; // 同じ公演を二重には持てない
      // 保存したあとで時間割が直っているかもしれない。実在する回だけ通す
      if (!show.slots.some((x) => x.day === f.day && x.start === f.start && x.end === f.end)) continue;
      seen.add(f.showId);
      fixed.push({ day: f.day, start: f.start, end: f.end, showId: f.showId });
    } else {
      if (f.start >= f.end) continue;
      fixed.push({ day: f.day, start: f.start, end: f.end, label: String(f.label ?? "休憩") });
    }
  }

  const windows = {};
  const w = raw.windows;
  if (w && typeof w === "object") {
    for (const d of goingSet) {
      const x = w[d];
      if (!x || typeof x !== "object") continue;
      const from = isHHMM(x.from) ? x.from : "";
      const to = isHHMM(x.to) ? x.to : "";
      if (from || to) windows[d] = { from, to };
    }
  }

  return {
    fixed,
    favorites: (Array.isArray(raw.favorites) ? raw.favorites : []).filter((id) => byId.has(id)),
    going: [...goingSet],
    windows,
    onlyFav: raw.onlyFav === true,
    introDone: raw.introDone === true,
  };
}

/** localStorage が使えない環境（プライベートモードなど）でも落とさない。 */
function loadState(store, ctx) {
  try {
    return decodeState(JSON.parse(store.getItem(STORAGE_KEY)), ctx);
  } catch {
    return null;
  }
}

function saveState(store, s) {
  try {
    store.setItem(STORAGE_KEY, JSON.stringify(encodeState(s)));
    return true;
  } catch {
    return false;
  }
}

/* ---------------- 共有 ---------------- */
//
// 立てた予定をURLに畳む。区切り文字を使わず、桁数を決め打ちにして詰める。
//
//   公演      code(1) 日(1) 開始(2)             → 4文字   例 g0q4
//   空け時間  "-" 日(1) 開始(2) 終了(2) 名札(1) → 7文字   例 -0nwo81
//
// 時刻は分を36進で2桁。20:20 = 1220 = "xw" で収まる（36進2桁は1295まで）。
// 名札は決まった4つなので番号1桁。おかげで日本語がURLに出ない。
//
// 回は「何回目か」ではなく「何時からか」で持つ。時間割を直したときに
// 黙って別の回にすり替わるより、その予定が落ちるほうがましなので。

const PLAN_VERSION = "2";
const MAX36 = 36 * 36; // 36進2桁で表せる分数の上限

const b36 = (n) => n.toString(36).padStart(2, "0");
const un36 = (s) => (/^[0-9a-z]{2}$/.test(s) ? parseInt(s, 36) : NaN);

/** 予定をURLの断片にする。何も無ければ空文字。 */
function encodePlan(fixed, { shows, days, labels }) {
  const byId = new Map(shows.map((s) => [s.id, s]));
  const parts = [];

  for (const f of fixed) {
    const d = days.indexOf(f.day);
    if (d < 0 || d > 9) continue;
    const a = toMinutes(f.start);
    const b = toMinutes(f.end);
    if (a >= MAX36 || b >= MAX36) continue;

    if (f.showId != null) {
      const show = byId.get(f.showId);
      if (!show || !show.code) continue;
      if (!show.slots.some((x) => x.day === f.day && x.start === f.start)) continue;
      parts.push(show.code + d + b36(a));
    } else {
      const li = labels.indexOf(f.label);
      parts.push("-" + d + b36(a) + b36(b) + (li < 0 ? 0 : li));
    }
  }

  return parts.length ? PLAN_VERSION + parts.join("") : "";
}

/**
 * URLの断片を予定に戻す。
 * 人からもらうものなので、読めない部分は落として、通ったぶんだけ返す。
 */
function decodePlan(str, { shows, days, labels }) {
  if (typeof str !== "string" || str[0] !== PLAN_VERSION) return [];

  const byCode = new Map(shows.filter((s) => s.code).map((s) => [s.code, s]));
  const out = [];
  const seen = new Set();

  let i = 1;
  while (i < str.length) {
    if (str[i] === "-") {
      const [d, a, b, li] = [str[i + 1], un36(str.slice(i + 2, i + 4)), un36(str.slice(i + 4, i + 6)), str[i + 6]];
      i += 7;
      if (!days[d] || !(a >= 0) || !(b >= 0) || a >= b) continue;
      out.push({ day: days[d], start: toHHMM(a), end: toHHMM(b), label: labels[li] ?? labels[0] });
    } else {
      const show = byCode.get(str[i]);
      const day = days[str[i + 1]];
      const at = un36(str.slice(i + 2, i + 4));
      i += 4;
      if (!show || !day || !(at >= 0) || seen.has(show.id)) continue;
      const sl = show.slots.find((x) => x.day === day && toMinutes(x.start) === at);
      if (!sl) continue;
      seen.add(show.id);
      out.push({ day: sl.day, start: sl.start, end: sl.end, showId: show.id });
    }
  }

  return out;
}

/* ===== ui.js ===== */
// 画面。ロジックは planner.js、データは shows.js。ここは描画と操作だけ。
//
// 導線は上下2ペイン。
//   上 = 「1 押さえる → 2 埋める」の二段階
//   下 = 土日ぶんの自分の予定
// 主役は手動。自分で参加する回まで選んで置く。プランナーは残った空きを埋める役に回る。






const BUFFER = 10;
/** 空けておく時間の名前。ここに無いものは「用事」で足りる、という想定 */
const BREAK_LABELS = ["休憩", "ごはん", "移動", "用事"];
const ALL_DAYS = FES.days.map((d) => d.id);
const DAY_LABEL = Object.fromEntries(FES.days.map((d) => [d.id, d.label + "(" + d.weekday + ")"]));
const VENUE_ORDER = ["hallHigh", "room2f", "hall2f"];

const yen = (n) => "¥" + n.toLocaleString("ja-JP");
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const vcol = (v) => "var(--v-" + v + ")";
const byId = new Map(SHOWS.map((s) => [s.id, s]));

function el(t, c, x) {
  const e = document.createElement(t);
  if (c) e.className = c;
  if (x != null) e.textContent = x;
  return e;
}

/** 公演のキービジュアル。data URI で同梱してあるので、圏外でも出る。 */
function thumb(show, cls) {
  const img = el("img", "th " + cls);
  img.src = SHOW_IMAGES[show.id];
  img.alt = "";
  return img;
}

/* ---------------- 時刻の入力 ---------------- */
// OS の time 入力は端末ごとに見た目も操作も違うので使わない。
// フェスの開催時間だけを、時→分の2タップで選ばせる。

const PICK_MIN_STEP = 5;

/**
 * 押すと下に時と分が開く時刻ボタン。
 * key はどのボタンが開いているかを覚えるための識別子。
 */
function timeField(key, value, onChange, opts = {}) {
  const wrap = el("div", "tf");

  const btn = el("button", "tfb" + (value ? "" : " empty"));
  btn.append(value || opts.placeholder || "指定なし");
  btn.setAttribute("aria-expanded", String(S.picker === key));
  btn.setAttribute("aria-label", (opts.label ?? "時刻") + (value ? " " + value : " 未指定"));
  btn.onclick = () => {
    S.picker = S.picker === key ? null : key;
    render();
  };
  wrap.appendChild(btn);

  if (value && opts.clearable) {
    const c = el("button", "tfx", "×");
    c.setAttribute("aria-label", (opts.label ?? "時刻") + " の指定をやめる");
    c.onclick = () => {
      S.picker = null;
      onChange("");
    };
    wrap.appendChild(c);
  }

  if (S.picker !== key) return wrap;

  const cur = value ? toMinutes(value) : null;
  const h0 = Math.floor(T0 / 60);
  const h1 = Math.floor((T1 - 1) / 60);

  const pop = el("div", "tfp");
  const hr = el("div", "tfr");
  for (let h = h0; h <= h1; h++) {
    const b = el("button", null, String(h));
    b.setAttribute("aria-pressed", String(cur !== null && Math.floor(cur / 60) === h));
    b.onclick = () => {
      onChange(hhmm(h * 60 + (cur === null ? 0 : cur % 60)));
    };
    hr.appendChild(b);
  }
  pop.append(el("div", "tfl", "時"), hr);

  const mr = el("div", "tfr min");
  for (let m = 0; m < 60; m += PICK_MIN_STEP) {
    const b = el("button", null, String(m).padStart(2, "0"));
    b.setAttribute("aria-pressed", String(cur !== null && cur % 60 === m));
    b.onclick = () => {
      const h = cur === null ? h0 : Math.floor(cur / 60);
      S.picker = null;
      onChange(hhmm(h * 60 + m));
    };
    mr.appendChild(b);
  }
  pop.append(el("div", "tfl", "分"), mr);

  wrap.appendChild(pop);
  return wrap;
}

/* fixed が予定の唯一の状態。置いた公演も休憩も同じ形で持つ。 */
const S = {
  fixed: [],
  phase: 1,
  open: null,
  justAdded: new Set(),
  favorites: new Set(),
  windows: {},
  onlyFav: false,
  going: new Set(ALL_DAYS), // 参加する日
  picker: null, // 開いている時刻ボタン
  intro: true, // 使い方を出しているか
  clearing: false, // 全部はずすの確認中か
  brk: { day: ALL_DAYS[0], start: "12:30", end: "13:30", label: BREAK_LABELS[0] },
  mode: "make", // つくる / みる
  viewDay: "auto", // みる で出す日。auto は会期中なら今日、ふだんは両日
  topOpen: true, // つくる のとき、上の一覧をひらいているか
  brkOpen: false, // 「空けておく」をひらいているか
  shareOpen: false, // 共有のURLを出しているか
  copied: false,
  shared: false, // 人からもらった予定を見ているか（この間は保存しない）
  mine: null, // もらった予定を見ている間、自分の予定を預かっておく
};

/** 共有まわりで使う、今のデータの形。 */
const PCTX = { shows: SHOWS, days: ALL_DAYS, labels: BREAK_LABELS };

/* 前に立てた予定を読み戻す。当日に開き直して消えていたら困る。 */
const store = (() => {
  try {
    return window.localStorage;
  } catch {
    return null; // ブラウザの設定で使えないことがある
  }
})();

if (store) {
  const saved = loadState(store, { shows: SHOWS, days: ALL_DAYS });
  if (saved) {
    S.fixed = saved.fixed;
    S.favorites = new Set(saved.favorites);
    S.going = new Set(saved.going);
    S.windows = saved.windows;
    S.onlyFav = saved.onlyFav;
    S.intro = !saved.introDone;
  }
}

// URLに予定が乗っていたら、それを見せる。ただし相手の予定で自分の保存を
// 上書きはしない。取り込むと言われるまでは、預かったまま表示だけ差し替える。
function takeShared() {
  const m = /[#&]p=([^&]+)/.exec(location.hash);
  const plan = m ? decodePlan(decodeURIComponent(m[1]), PCTX) : [];
  if (!plan.length) return false;
  if (!S.shared) S.mine = S.fixed; // 預かるのは最初の一度だけ
  S.fixed = plan;
  S.shared = true;
  S.intro = false;
  return true;
}

takeShared();

const dropHash = () => history.replaceState(null, "", location.pathname + location.search);

function shareUrl() {
  const p = encodePlan(S.fixed, PCTX);
  return location.origin + location.pathname + (p ? "#p=" + p : "");
}

const winOf = (day) => S.windows[day] ?? { from: "", to: "" };
const DAYS = () => ALL_DAYS.filter((d) => S.going.has(d));

/**
 * 板に出す日。つくる のときは常に両日（片方だけ見ながら組むと、
 * もう片方に回せる、が見えなくなる）。みる のときだけ片日に絞れる。
 * 会期中に みる を開いたら、何も選ばなくても今日だけにする。
 */
function viewDays() {
  const all = DAYS();
  if (S.mode !== "view" || all.length < 2) return all;
  const v = S.viewDay === "auto" ? festivalNow(new Date(), FES)?.day ?? null : S.viewDay;
  return v && all.includes(v) ? [v] : all;
}

const placedIds = () => new Set(S.fixed.filter((f) => f.showId).map((f) => f.showId));
const onDay = (day) =>
  S.fixed
    .filter((f) => f.day === day)
    .map((f) => ({ ...f, a: toMinutes(f.start), b: toMinutes(f.end) }))
    .sort((x, y) => x.a - y.a);

const optionsIndex = () =>
  new Map(
    placementOptions(SHOWS, S.fixed, { days: DAYS(), bufferMin: BUFFER }).map((p) => [
      p.showId,
      p.options,
    ]),
  );

/* 全日の時間軸をそろえる */
const ALL = SHOWS.flatMap((s) => s.slots.map((x) => [toMinutes(x.start), toMinutes(x.end)]));
const T0 = Math.floor(Math.min(...ALL.map((x) => x[0])) / 60) * 60;
const T1 = Math.ceil(Math.max(...ALL.map((x) => x[1])) / 60) * 60;
const PPM = 1.02;

/* ---------------- 上ペイン: 段階1 押さえる ---------------- */
function phase1(host) {
  const bar = el("div", "setbar");

  // 参加する日
  const go = el("div", "godays");
  go.appendChild(el("span", "lbl", "行く日"));
  for (const d of ALL_DAYS) {
    const b = el("button", null, DAY_LABEL[d]);
    b.setAttribute("aria-pressed", String(S.going.has(d)));
    b.onclick = () => {
      if (S.going.has(d)) {
        if (S.going.size === 1) return; // 全部消させない
        S.going.delete(d);
        S.fixed = S.fixed.filter((f) => f.day !== d); // 行かない日の予定は落とす
      } else {
        S.going.add(d);
      }
      render();
    };
    go.appendChild(b);
  }
  bar.appendChild(go);
  host.appendChild(bar);

  host.appendChild(
    el("p", "hint", "公演をひらいて回を選ぶと、その回で確定します。★は「埋める」で先に入ります。"),
  );

  // お気に入りが入らなくなったら、入れ替え案を出す
  for (const r of rescueSuggestions(SHOWS, S.fixed, [...S.favorites], {
    days: DAYS(),
    bufferMin: BUFFER,
  })) {
    const box = el("div", "rescue");
    box.appendChild(el("b", null, "★" + r.title + " が入らなくなりました"));
    if (!r.swaps.length) {
      box.append("どの予定を動かしても入りません。どれかをはずしてください。");
    } else {
      box.append("こう入れ替えると入ります:");
      for (const s of r.swaps) {
        const b = el(
          "button",
          null,
          s.title +
            " を " +
            DAY_LABEL[s.to.day] +
            " " +
            s.to.start +
            " に移す（" +
            r.title +
            " は " +
            DAY_LABEL[s.thenAt.day] +
            " " +
            s.thenAt.start +
            "）",
        );
        b.onclick = () => {
          const t = S.fixed.find(
            (f) => f.showId === s.showId && f.day === s.from.day && f.start === s.from.start,
          );
          if (t) {
            t.day = s.to.day;
            t.start = s.to.start;
            t.end = s.to.end;
          }
          S.fixed.push({ day: s.thenAt.day, start: s.thenAt.start, end: s.thenAt.end, showId: r.showId });
          S.justAdded.add(r.showId);
          render();
        };
        box.appendChild(b);
      }
    }
    host.appendChild(box);
  }

  host.appendChild(breakPanel());

  const opts = optionsIndex();
  const placed = placedIds();

  for (const v of VENUE_ORDER) {
    const list = SHOWS.filter((s) => s.venue === v);
    if (!list.length) continue;
    host.appendChild(el("div", "vh", VENUES[v].label));
    const box = el("div", "slist");
    for (const show of list) box.appendChild(showRow(show, opts, placed));
    host.appendChild(box);
  }
}

/**
 * 入れてほしくない時間を先に取っておく。
 * ごはんも移動も用事も、押さえた予定と同じ扱いにすれば埋める側が勝手に避ける。
 */
function breakPanel() {
  const box = el("div", "brk" + (S.brkOpen ? " open" : ""));

  // 毎回使うものではないので、畳んでおいて一覧に場所を譲る
  const head = el("button", "brkh");
  head.setAttribute("aria-expanded", String(S.brkOpen));
  head.append(el("span", "sign", S.brkOpen ? "−" : "＋"), "この時間は空けておく");
  head.onclick = () => {
    S.brkOpen = !S.brkOpen;
    S.picker = null;
    render();
  };
  box.appendChild(head);
  if (!S.brkOpen) return box;

  const days = DAYS();
  if (!days.includes(S.brk.day)) S.brk.day = days[0];

  if (days.length > 1) {
    const row = el("div", "brkrow");
    const seg = el("div", "seg");
    for (const d of days) {
      const b = el("button", null, DAY_LABEL[d]);
      b.setAttribute("aria-pressed", String(S.brk.day === d));
      b.onclick = () => {
        S.brk.day = d;
        render();
      };
      seg.appendChild(b);
    }
    row.appendChild(seg);
    box.appendChild(row);
  }

  // 「午後ぜんぶ」もありうるので、長さを選ばせるのではなく終わりの時刻を選ばせる。
  // どちらを動かしても start < end は崩さない。相手を追い出す形で守る
  const trow = el("div", "brkrow times");
  trow.appendChild(
    timeField("brk-a", S.brk.start, (v) => {
      if (!v) return;
      S.brk.start = v;
      if (toMinutes(S.brk.end) <= toMinutes(v)) {
        S.brk.end = hhmm(Math.min(toMinutes(v) + 60, T1));
      }
      render();
    }, { label: "空ける時間の始まり" }),
  );
  trow.appendChild(el("span", "tfsep", "〜"));
  trow.appendChild(
    timeField("brk-b", S.brk.end, (v) => {
      if (!v) return;
      S.brk.end = v;
      if (toMinutes(v) <= toMinutes(S.brk.start)) {
        S.brk.start = hhmm(Math.max(toMinutes(v) - 60, T0));
      }
      render();
    }, { label: "空ける時間の終わり" }),
  );
  box.appendChild(trow);

  const labrow = el("div", "seg lab");
  for (const t of BREAK_LABELS) {
    const b = el("button", null, t);
    b.setAttribute("aria-pressed", String(S.brk.label === t));
    b.onclick = () => {
      S.brk.label = t;
      render();
    };
    labrow.appendChild(b);
  }
  box.appendChild(labrow);

  const a = toMinutes(S.brk.start);
  const b = toMinutes(S.brk.end);
  // 予定に重ねて置けてしまうと、あきの合計がマイナスになる。ぴったり隣は許す
  const hit = onDay(S.brk.day).find((f) => a < f.b && f.a < b);

  const put = el(
    "button",
    "btn",
    hit
      ? (hit.showId ? byId.get(hit.showId).title : hit.label) + " と重なります"
      : DAY_LABEL[S.brk.day] + " " + S.brk.start + "–" + S.brk.end + " を" + S.brk.label + "で空ける",
  );
  put.disabled = Boolean(hit);
  put.onclick = () => {
    S.fixed.push({ day: S.brk.day, start: hhmm(a), end: hhmm(b), label: S.brk.label });
    S.picker = null;
    render();
  };
  box.appendChild(put);
  return box;
}

function showRow(show, opts, placed) {
  const done = placed.has(show.id);
  const row = el("div", "srow" + (done ? " done" : ""));
  row.style.setProperty("--venue", vcol(show.venue));

  const head = el("div", "shead");
  const fav = el("button", "fav", S.favorites.has(show.id) ? "★" : "☆");
  fav.setAttribute("aria-pressed", String(S.favorites.has(show.id)));
  fav.setAttribute("aria-label", show.title + " をお気に入りにする");
  fav.onclick = () => {
    S.favorites.has(show.id) ? S.favorites.delete(show.id) : S.favorites.add(show.id);
    render();
  };
  head.appendChild(fav);

  const title = el("button", "stitle");
  title.setAttribute("aria-expanded", String(S.open === show.id));
  title.appendChild(thumb(show, "sm"));

  const txt = el("div", "stxt");
  const line1 = el("div", "nmline");
  if (done) line1.appendChild(el("span", "tick", "✓"));
  line1.appendChild(el("span", "nm", show.title));
  txt.appendChild(line1);

  const left = opts.get(show.id)?.length ?? 0;
  const meta = el("div", "meta");
  meta.appendChild(el("span", null, show.durationMin + "分"));
  meta.appendChild(el("span", null, show.people));
  meta.appendChild(el("span", null, yen(show.price) + (show.unit === "group" ? "/回" : "")));
  if (done) meta.appendChild(el("span", "okq", "参加する"));
  else if (left === 0) meta.appendChild(el("span", "warnq", "入らない"));
  else if (left <= 2) meta.appendChild(el("span", "warnq", "残り" + left));
  txt.appendChild(meta);
  title.appendChild(txt);

  title.onclick = () => {
    S.open = S.open === show.id ? null : show.id;
    render();
  };
  head.appendChild(title);
  row.appendChild(head);

  if (S.open !== show.id) return row;

  const box = el("div", "slots");

  const link = el("a", "slink", "escape.id で詳細・予約");
  link.href = show.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  if (done) {
    const cur = S.fixed.find((f) => f.showId === show.id);
    box.appendChild(el("div", "dl", DAY_LABEL[cur.day] + " " + cur.start + "–" + cur.end + " で参加"));
    const off = el("button", "btn sub", "やめる");
    off.onclick = () => {
      S.fixed = S.fixed.filter((f) => f.showId !== show.id);
      S.justAdded.delete(show.id);
      render();
    };
    box.appendChild(off);
    box.appendChild(link);
    row.appendChild(box);
    return row;
  }

  if (show.priceNote) box.appendChild(el("div", "dl", show.priceNote));

  const ok = new Set((opts.get(show.id) ?? []).map((o) => o.day + o.start));
  for (const day of DAYS()) {
    const slots = show.slots.filter((s) => s.day === day);
    if (!slots.length) continue;
    box.appendChild(el("div", "dl", DAY_LABEL[day]));
    const sc = el("div", "sc");
    for (const s of slots) {
      const b = el("button", null, s.start);
      b.disabled = !ok.has(day + s.start);
      b.title = s.start + "–" + s.end + (b.disabled ? "（他の予定とぶつかります）" : "");
      b.setAttribute("aria-label", DAY_LABEL[day] + " " + s.start + "から参加する");
      b.onclick = () => {
        S.fixed.push({ day, start: s.start, end: s.end, showId: show.id });
        S.open = null;
        render();
      };
      sc.appendChild(b);
    }
    box.appendChild(sc);
  }
  box.appendChild(link);
  row.appendChild(box);
  return row;
}

/* ---------------- 上ペイン: 段階2 埋める ---------------- */
function phase2(host) {
  // 公演がひとつも無くても、空けた時間だけ置いて全部おまかせ、は成り立つ
  if (S.fixed.length === 0) {
    host.appendChild(
      el("p", "hint", "まず「押さえる」で参加する回を置くか、空けておきたい時間を決めてください。ここは残りを埋める段階です。"),
    );
    return;
  }

  host.appendChild(
    el("p", "hint", "置いた予定は動かしません。土日どちらも見たうえで、待ち時間が短くなるように詰めます。"),
  );

  // 日ごとの時間帯。入れてほしい時間の範囲を絞る
  for (const day of DAYS()) {
    const w = winOf(day);
    const set = (k) => (v) => {
      S.windows[day] = { ...w, [k]: v };
      render();
    };
    const r = el("div", "winrow");
    r.appendChild(el("span", "lbl", DAY_LABEL[day]));
    r.appendChild(
      timeField("w-" + day + "-from", w.from, set("from"), {
        label: DAY_LABEL[day] + " これ以降に入れる",
        placeholder: "はじめから",
        clearable: true,
      }),
    );
    r.appendChild(el("span", "tilde", "〜"));
    r.appendChild(
      timeField("w-" + day + "-to", w.to, set("to"), {
        label: DAY_LABEL[day] + " これ以前に終える",
        placeholder: "おわりまで",
        clearable: true,
      }),
    );
    host.appendChild(r);
  }

  const favOnly = el("label", "favonly");
  const cb = el("input");
  cb.type = "checkbox";
  cb.checked = S.onlyFav;
  cb.onchange = () => {
    S.onlyFav = cb.checked;
    render();
  };
  favOnly.append(cb, "★を付けた公演だけを入れる");
  host.appendChild(favOnly);

  const res = suggestFills(SHOWS, S.fixed, {
    days: DAYS(),
    bufferMin: BUFFER,
    favoriteIds: [...S.favorites],
    onlyFavorites: S.onlyFav,
    windows: S.windows,
  });
  const favIn = res.added.filter((a) => S.favorites.has(a.showId)).length;

  const bar = el("div", "restbar");
  const go = el(
    "button",
    "btn",
    res.added.length
      ? "おまかせで " + res.added.length + "公演 入れる" + (favIn ? "（★" + favIn + "）" : "")
      : "もう入りません",
  );
  go.disabled = !res.added.length;
  go.onclick = () => {
    for (const a of res.added) {
      S.fixed.push({ day: a.day, start: a.start, end: a.end, showId: a.showId });
      S.justAdded.add(a.showId);
    }
    render();
  };
  bar.appendChild(go);
  host.appendChild(bar);
  if (res.added.length) {
    host.appendChild(
      el(
        "p",
        "hint",
        "入れたあとのあき合計: " +
          DAYS()
            .map((d) => DAY_LABEL[d] + " " + (res.idleByDay[d] ?? 0) + "分")
            .join(" / "),
      ),
    );
  }

  const opts = optionsIndex();
  let any = false;
  for (const day of DAYS()) {
    for (const g of gapsOf(day)) {
      const cands = [];
      for (const [id, list] of opts) {
        const hit = list.find((o) => o.day === day && o.startMin >= g.a && o.endMin <= g.b);
        if (hit) cands.push({ id, hit, left: list.length });
      }
      if (!cands.length) continue;
      any = true;
      const c = el("div", "gapc");
      c.appendChild(el("div", "gt", DAY_LABEL[day] + "　" + hhmm(g.a) + "〜" + hhmm(g.b)));
      c.appendChild(el("div", "gs", g.b - g.a + "分あいています"));
      const chips = el("div", "chips");
      cands.sort((x, y) => x.left - y.left || x.hit.startMin - y.hit.startMin);
      for (const cd of cands.slice(0, 6)) {
        const show = byId.get(cd.id);
        const b = el("button", "chip");
        b.style.setProperty("--venue", vcol(show.venue));
        b.append(show.title + " " + cd.hit.start);
        if (cd.left === 1) b.appendChild(el("span", "lc", "　最後の枠"));
        b.onclick = () => {
          S.fixed.push({ day, start: cd.hit.start, end: cd.hit.end, showId: cd.id });
          S.justAdded.add(cd.id);
          render();
        };
        chips.appendChild(b);
      }
      c.appendChild(chips);
      host.appendChild(c);
    }
  }
  if (!any) host.appendChild(el("p", "none", "空いているところに入る公演はもうありません。"));
}

/** その日の予定のあいだの空き。前後の余裕(バッファ)を引いた実効の範囲で返す。 */
function gapsOf(day) {
  const list = onDay(day);
  const out = [];
  let cur = T0;
  for (const f of list) {
    if (f.a - cur > BUFFER) out.push({ a: cur, b: f.a });
    cur = Math.max(cur, f.b);
  }
  if (T1 - cur > BUFFER) out.push({ a: cur, b: T1 });
  return out;
}

/* ---------------- 下ペイン: 両日の予定 ---------------- */
/* ---------------- 当日 ---------------- */
// 当日、会場で見るのは全体図ではなく「次に何をするか」だけ。
// 端末の時計が会期の中に入っている間だけ、板の一番上に出す。

/** 分を読める長さにする。 */
function dur(m) {
  if (m < 60) return m + "分";
  const h = Math.floor(m / 60);
  return h + "時間" + (m % 60 ? (m % 60) + "分" : "");
}

/** 予定1件を「15:40 タイトル」と「会場」に開く。 */
function itemText(f) {
  const show = f.showId ? byId.get(f.showId) : null;
  return {
    title: show ? show.title : f.label ?? "空けた時間",
    where: show ? VENUES[show.venue].label : "",
    venue: show ? show.venue : null,
  };
}

function nowRow(kind, label, f, tail) {
  const t = itemText(f);
  const row = el("div", "nrow " + kind);
  if (t.venue) row.style.setProperty("--venue", vcol(t.venue));
  const head = el("div", "nh");
  head.appendChild(el("span", "nk", label));
  head.appendChild(el("span", "nt", t.title));
  row.appendChild(head);

  // 残り時間は題名の横に置くと、狭い画面で題名が削られる。下の行に逃がす
  const sub = el("div", "nsub");
  sub.appendChild(el("span", null, [f.start + "–" + f.end, t.where].filter(Boolean).join(" ／ ")));
  if (tail) sub.appendChild(el("span", "nx", tail));
  row.appendChild(sub);
  return row;
}

function nowPanel(host, now) {
  if (!S.fixed.length) return;

  // 会期外は、当日ここに何が出るのかだけ見せておく
  if (!now) {
    const first = S.fixed
      .slice()
      .sort((a, b) => (a.day + a.start).localeCompare(b.day + b.start))[0];
    const box = el("div", "now pre");
    box.appendChild(el("div", "npre", "当日はここに次の予定が出ます"));
    box.appendChild(nowRow("nxt", DAY_LABEL[first.day], first, null));
    host.appendChild(box);
    return;
  }

  const r = nowNext(S.fixed, now);
  const box = el("div", "now");

  if (r.current) box.appendChild(nowRow("cur", "いま", r.current, "残り" + dur(r.leftOfCurrent)));
  if (r.next) box.appendChild(nowRow("nxt", "次", r.next, "あと" + dur(r.untilNext)));

  if (!r.current && !r.next) {
    box.appendChild(el("div", "nend", r.done.length ? "今日はこれで終わり。おつかれさま" : "今日の予定はありません"));
  } else if (r.later.length) {
    box.appendChild(el("div", "nfoot", "このあと " + r.later.length + "件"));
  }

  host.appendChild(box);
}

/* ---------------- 共有 ---------------- */

/** もらった予定を見ているあいだの断り。取り込むまでは自分の予定に触らない。 */
function sharedBar(host) {
  const bar = el("div", "shbar");
  bar.appendChild(
    el("b", null, "送られてきた予定です（" + S.fixed.length + "件）"),
  );
  bar.appendChild(
    el("span", "q", "まだ保存していません。取り込むと、いま自分が立てている予定は置き換わります。"),
  );

  const take = el("button", "clr armed", "自分の予定にする");
  take.onclick = () => {
    S.shared = false;
    S.mine = null;
    dropHash();
    render();
  };
  const back = el("button", "clr", "見るだけ（元に戻す）");
  back.onclick = () => {
    S.fixed = S.mine ?? [];
    S.shared = false;
    S.mine = null;
    dropHash();
    render();
  };
  bar.append(take, back);
  host.appendChild(bar);
}

/** 自分の予定を渡す。URLに畳んであるので、貼れればどこでも渡る。 */
function sharePanel(host) {
  const box = el("div", "share");
  const url = shareUrl();

  const inp = el("input", "surl");
  inp.value = url;
  inp.readOnly = true;
  inp.setAttribute("aria-label", "この予定のURL");
  inp.onfocus = () => inp.select();
  box.appendChild(inp);

  const cp = el("button", "clr" + (S.copied ? " armed" : ""), S.copied ? "コピーしました" : "コピー");
  cp.onclick = () => {
    const done = () => {
      S.copied = true;
      render();
    };
    // クリップボードは使えないことがある。そのときは選ばせる
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url).then(done, () => inp.select());
    } else {
      inp.select();
    }
  };
  box.appendChild(cp);

  box.appendChild(
    el("p", "fine", "開いた人には、この予定が「送られてきた予定」として出ます。その人が今立てている予定は、取り込むと言うまで消えません。"),
  );
  host.appendChild(box);
}

function board(host) {
  if (S.shared) sharedBar(host);

  if (S.mode === "view" && !S.fixed.length) {
    const b = el("div", "vacant");
    b.appendChild(el("b", null, "まだ予定がありません"));
    const go = el("button", "btn", "つくる にもどる");
    go.onclick = () => {
      S.mode = "make";
      render();
    };
    b.appendChild(go);
    host.appendChild(b);
    return;
  }

  const now = festivalNow(new Date(), FES);
  nowPanel(host, now);

  const days = viewDays();

  // 片日だけ出しているときは、合計もその日のぶんだけにする
  const list = S.fixed
    .filter((f) => f.showId && days.includes(f.day))
    .map((f) => byId.get(f.showId));
  let per = 0;
  let grp = 0;
  for (const s of list) (s.unit === "group" ? (grp += s.price) : (per += s.price));
  const money = [per && yen(per) + "/人", grp && yen(grp) + "/回"].filter(Boolean).join(" ＋ ") || "—";

  const tot = el("div", "tot");
  tot.appendChild(el("b", null, list.length + "公演"));
  for (const d of days) {
    const evs = onDay(d);
    let idle = 0;
    for (let i = 1; i < evs.length; i++) idle += evs[i].a - evs[i - 1].b;
    tot.appendChild(
      el("span", null, DAY_LABEL[d] + " " + evs.filter((f) => f.showId).length + "（あき" + idle + "分）"),
    );
  }
  tot.appendChild(el("span", "sp", money));
  host.appendChild(tot);

  // 当日は片方しか行かない。みる のときだけ、日で絞れるようにする
  if (S.mode === "view" && DAYS().length > 1) {
    const seg = el("div", "seg vday");
    const shown = days.length > 1 ? null : days[0];
    for (const [key, label] of [[null, "両日"], ...DAYS().map((d) => [d, DAY_LABEL[d]])]) {
      const b = el("button", null, label);
      b.setAttribute("aria-pressed", String(shown === key));
      b.onclick = () => {
        S.viewDay = key;
        render();
      };
      seg.appendChild(b);
    }
    host.appendChild(seg);
  }

  // 全部はずす。取り返しがつかないので、押した先で一度止める
  if (S.fixed.length) {
    const bar = el("div", "clrbar");
    if (!S.clearing) {
      const b = el("button", "clr", "全部はずす");
      b.onclick = () => {
        S.clearing = true;
        render();
      };
      bar.appendChild(b);

      const sh = el("button", "clr", S.shareOpen ? "とじる" : "この予定を送る");
      sh.setAttribute("aria-expanded", String(S.shareOpen));
      sh.onclick = () => {
        S.shareOpen = !S.shareOpen;
        S.copied = false;
        render();
      };
      bar.appendChild(sh);
    } else {
      bar.appendChild(el("span", "q", S.fixed.length + "件の予定を全部はずします。★は残ります。"));
      const yes = el("button", "clr armed", "はずす");
      yes.onclick = () => {
        S.fixed = [];
        S.justAdded.clear();
        S.open = null;
        S.clearing = false;
        render();
      };
      const no = el("button", "clr", "やめる");
      no.onclick = () => {
        S.clearing = false;
        render();
      };
      bar.append(yes, no);
    }
    host.appendChild(bar);
    if (S.shareOpen && !S.clearing) sharePanel(host);
  }

  const grid = el("div", "board");
  // 出す日の数だけ列を引く。1日だけなら幅が倍になって題名が読める
  grid.style.gridTemplateColumns = "32px " + "1fr ".repeat(days.length).trim();
  grid.appendChild(el("div", "dh ax", "."));
  for (const d of days) grid.appendChild(el("div", "dh", DAY_LABEL[d]));

  const H = (T1 - T0) * PPM;
  const ax = el("div", "axc");
  ax.style.height = H + "px";
  for (let m = T0; m <= T1; m += 60) {
    const t = el("div", "tk", hhmm(m));
    t.style.top = (m - T0) * PPM + "px";
    ax.appendChild(t);
  }
  grid.appendChild(ax);

  for (const day of days) {
    const col = el("div", "daycol");
    col.style.height = H + "px";
    for (let m = T0; m <= T1; m += 60) {
      const h = el("div", "hr");
      h.style.top = (m - T0) * PPM + "px";
      col.appendChild(h);
    }
    const evs = onDay(day);
    if (!evs.length) col.appendChild(el("div", "emptyday", "まだ予定なし"));
    for (const f of evs) {
      const show = f.showId ? byId.get(f.showId) : null;
      // 終わったものは薄くする。当日、残りだけを目で拾えるように
      const past = now && (day < now.day || (day === now.day && f.b <= now.min));
      const e = el(
        "div",
        "ev" + (show ? "" : " rest") + (past ? " past" : "") +
          (show && S.justAdded.has(show.id) ? " new" : ""),
      );
      if (show) e.style.setProperty("--venue", vcol(show.venue));
      e.style.top = (f.a - T0) * PPM + "px";
      e.style.height = (f.b - f.a) * PPM - 2 + "px";
      const x = el("button", "x", "×");
      x.setAttribute("aria-label", (show ? show.title : f.label ?? "空けた時間") + " をはずす");
      x.onclick = () => {
        S.fixed = S.fixed.filter(
          (g) => !(g.day === f.day && g.start === f.start && g.showId === f.showId && g.label === f.label),
        );
        render();
      };
      e.appendChild(x);
      if (show && (f.b - f.a) * PPM >= 44) e.appendChild(thumb(show, "xs"));
      e.appendChild(el("div", "et", show ? show.title : f.label ?? "休憩"));
      e.appendChild(el("div", "ee", f.start + "–" + f.end));
      col.appendChild(e);
    }
    grid.appendChild(col);
  }
  host.appendChild(grid);
}

/* ---------------- 使い方 ---------------- */
// 二段階の導線は、言われないと伝わらない。最初に一度だけ出して、
// 閉じたあとは見出しの「使い方」からいつでも戻せるようにする。
function intro() {
  const box = el("div", "intro");
  box.appendChild(el("h2", null, "2段階で組みます"));

  const ol = el("ol");
  for (const [n, ttl, body] of [
    [
      "1",
      "押さえる",
      "これだけは外せない公演を、参加する回まで自分で選んで置きます。ごはんや移動、用事で埋めたくない時間も、ここで先に空けておきます。",
    ],
    [
      "2",
      "埋める",
      "残った空き時間に入る公演を出します。押さえた予定は動かしません。土日どちらも同時に見て、待ち時間が短くなる入れ方を選びます。",
    ],
  ]) {
    const li = el("li");
    li.appendChild(el("span", "no", n));
    const d = el("div");
    d.appendChild(el("b", null, ttl));
    d.appendChild(el("p", null, body));
    li.appendChild(d);
    ol.appendChild(li);
  }
  box.appendChild(ol);

  box.appendChild(
    el("p", "fine", "★を付けた公演は「埋める」で優先して入ります。入らなくなったときは入れ替え方を出します。"),
  );

  const ok = el("button", "btn", "はじめる");
  ok.onclick = () => {
    S.intro = false;
    render();
  };
  box.appendChild(ok);
  return box;
}

/* ---------------- 描画 ---------------- */
let renderedPhase = null;

const modeBtn = { make: document.getElementById("m-make"), view: document.getElementById("m-view") };
for (const [m, b] of Object.entries(modeBtn)) {
  b.onclick = () => {
    S.mode = m;
    S.picker = null;
    render();
  };
}

function render() {
  const host = document.getElementById("app");
  // 描き直しで一覧の位置が戻ってしまうと、回を選ぶだけで迷子になる。
  // ただし段階を切り替えたときは中身が別物なので、頭から見せる。
  const keep = renderedPhase === S.phase ? host.querySelector(".topbody")?.scrollTop ?? 0 : 0;
  renderedPhase = S.phase;

  for (const [m, b] of Object.entries(modeBtn)) b.setAttribute("aria-pressed", String(S.mode === m));

  if (S.intro) {
    host.replaceChildren(intro());
    return;
  }

  // みる: 作る道具を全部しまって、でき上がった予定表だけにする
  if (S.mode === "view") {
    const only = el("div", "bot only");
    board(only);
    host.replaceChildren(only);
    if (store && !S.shared) saveState(store, S);
    return;
  }

  const top = el("div", "top" + (S.topOpen ? "" : " folded"));
  const ph = el("div", "phases");
  for (const [n, ttl, sub] of [
    [1, "押さえる", "STEP 1"],
    [2, "埋める", "STEP 2"],
  ]) {
    const b = el("button");
    b.appendChild(el("b", null, sub));
    b.append(ttl);
    b.setAttribute("aria-selected", String(S.phase === n));
    b.onclick = () => {
      S.phase = n;
      S.open = null;
      S.topOpen = true; // 畳んだまま段階だけ変わっても何も起きない
      render();
    };
    ph.appendChild(b);
  }

  // 一覧を畳めば、みるに移らなくてもその場で予定表が広がる
  const fold = el("button", "fold", S.topOpen ? "▲" : "▼");
  fold.setAttribute("aria-expanded", String(S.topOpen));
  fold.setAttribute("aria-label", S.topOpen ? "一覧を畳んで予定表を広げる" : "一覧をひらく");
  fold.onclick = () => {
    S.topOpen = !S.topOpen;
    S.picker = null;
    render();
  };
  ph.appendChild(fold);

  const body = el("div", "topbody");
  (S.phase === 1 ? phase1 : phase2)(body);
  top.append(ph, body);

  const bot = el("div", "bot");
  board(bot);

  host.replaceChildren(top, bot);
  host.querySelector(".topbody").scrollTop = keep;
  // もらった予定を見ているあいだは、自分の保存に手を出さない
  if (store && !S.shared) saveState(store, S);
}

document.getElementById("howto").onclick = () => {
  S.intro = true;
  render();
};

// 開いたままのタブで共有リンクを踏むと、読み込み直しは起きない
window.addEventListener("hashchange", () => {
  if (takeShared()) render();
});

// 当日は時計が進むぶんだけ表示が古くなる。分が変わったときだけ描き直す
let lastMin = -1;
setInterval(() => {
  const n = festivalNow(new Date(), FES);
  if (!n || n.min === lastMin || S.intro) return;
  lastMin = n.min;
  render();
}, 20000);

render();
})();
